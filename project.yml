name: TongHopDMX
options:
  bundleIdPrefix: com.thanhduong
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TongHopDMX:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MaNguon
      - path: TaiNguyen
        excludes:
          - ThongTin.plist
    dependencies:
      - target: DMXFlowExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhduong.v2dmx
        PRODUCT_NAME: TongHopDMX
        INFOPLIST_FILE: TaiNguyen/ThongTin.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DMXFlowExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TienIchSafariFlow/SafariWebExtensionHandler.swift
      - path: TienIchSafariFlow/Resources
        buildPhase: resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhduong.v2dmx.flow-extension
        PRODUCT_NAME: DMXFlowExtension
        INFOPLIST_FILE: TienIchSafariFlow/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  TongHopDMX:
    build:
      targets:
        TongHopDMX: all
    run:
      config: Debug
    archive:
      config: Release
